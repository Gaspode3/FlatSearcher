<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квартира у Львові</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Квартира у Львові</h1>
    <p class="meta" id="meta">Завантаження…</p>
  </header>

  <nav class="deal" id="deal" aria-label="Купівля чи оренда">
    <button data-deal="sale" class="active">🏠 Купівля</button>
    <button data-deal="rent">🔑 Оренда</button>
  </nav>

  <nav class="market" id="market" aria-label="Ринок">
    <button data-market="resale" class="active">🏚 Вторинка</button>
    <button data-market="new">🏗 Новобудови</button>
  </nav>

  <nav class="tabs" id="tabs" aria-label="Розділи">
    <button data-tab="unseen" class="active">Не переглянуті <span></span></button>
    <button data-tab="all">Усі <span></span></button>
    <button data-tab="picked">⭐ Обрані <span></span></button>
    <button data-tab="rejected">Відхилені <span></span></button>
  </nav>

  <section class="filters" aria-label="Фільтри">
    <div class="row fields">
      <label id="city-wrap">Місто
        <select id="f-city"></select>
      </label>
      <label>Кімнат
        <select id="f-rooms">
          <option value="all">Усі</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4+">4+</option>
          <option value="2+">2+</option>
          <option value="3+">3+</option>
        </select>
      </label>
      <label>До, $
        <input id="f-price" type="number" step="1000" inputmode="numeric">
      </label>
      <label>Від, м²
        <input id="f-area" type="number" step="5" inputmode="numeric" placeholder="0">
      </label>
      <label>Сортування
        <select id="f-sort">
          <option value="score">Найкращі збіги</option>
          <option value="new">Найновіші</option>
          <option value="price">Дешевші</option>
          <option value="ppm">Дешевший м²</option>
          <option value="area">Більша площа</option>
        </select>
      </label>
    </div>
    <div class="row chips">
      <label class="chip"><input type="checkbox" id="f-old"> 🏛 Старий фонд</label>
      <label class="chip sale-only"><input type="checkbox" id="f-repair"> 🔨 Під ремонт</label>
      <label class="chip rent-only"><input type="checkbox" id="f-pets"> 🐾 Можна з тваринами</label>
      <label class="chip rent-only"><input type="checkbox" id="f-nocomm"> 🙅 Без комісії</label>
      <label class="chip rent-only"><input type="checkbox" id="f-power"> 🔋 Генератор / укриття</label>
      <label class="chip"><input type="checkbox" id="f-owner"> 👤 Власник</label>
      <label class="chip"><input type="checkbox" id="f-budget"> 💵 У бюджеті</label>
      <label class="chip"><input type="checkbox" id="f-fresh"> 🧹 Сховати сумнівні</label>
      <label class="chip"><input type="checkbox" id="f-inactive"> Показати зниклі</label>
    </div>
  </section>

  <div class="focusbar" id="focusbar" hidden>
    <span>Показано одне оголошення</span>
    <button id="focus-clear">← До всіх</button>
  </div>
  <section class="complexes" id="complexes" hidden>
    <div class="cx-head">
      <h2>Пропозиції забудовників</h2>
      <div class="row chips">
        <label class="chip"><input type="checkbox" id="cx-budget" checked> 💵 Є 2+ кімн. у бюджеті</label>
        <label class="chip"><input type="checkbox" id="cx-ready"> ✅ Є здані будинки</label>
        <label class="chip"><input type="checkbox" id="cx-install"> 📆 Розтермінування</label>
      </div>
      <p class="count" id="cx-count"></p>
    </div>
    <div class="grid" id="cx-list"></div>
    <h2 class="resale-h">Квартири в новобудовах від власників і рієлторів</h2>
  </section>
  <p class="count" id="count"><span class="spinner"></span> Завантажую оголошення…</p>
  <main id="list" class="grid"></main>

  <div class="sheet" id="share-sheet" hidden>
    <div class="sheet-box" role="dialog" aria-label="Поділитись">
      <p class="sheet-title">Поділитись</p>
      <p class="sheet-sub" id="sh-sub"></p>
      <a id="sh-wa" target="_blank" rel="noopener">WhatsApp</a>
      <a id="sh-tg" target="_blank" rel="noopener">Telegram</a>
      <a id="sh-vb">Viber</a>
      <button id="sh-native" hidden>Інший застосунок…</button>
      <button id="sh-copy-card">Скопіювати посилання на картку</button>
      <button id="sh-copy">Скопіювати весь текст</button>
      <button id="sh-close" class="ghost">Закрити</button>
    </div>
  </div>

  <template id="card-tpl">
    <article class="card">
      <div class="gallery">
        <div class="strip"></div>
        <span class="pcount"></span>
        <span class="src"></span>
        <span class="newtag" hidden>Нове</span>
        <button class="fav" aria-label="Додати в обрані" title="В обрані">☆</button>
      </div>
      <div class="body">
        <div class="pricebox">
          <div class="price"><strong></strong><span class="ppm"></span></div>
          <p class="uah"></p>
        </div>
        <h2 class="title"></h2>
        <button class="code" title="Скопіювати посилання на цю картку"></button>
        <p class="linkwarn" hidden></p>
        <p class="stale" hidden></p>
        <p class="alsoon" hidden></p>
        <dl class="details"></dl>
        <div class="badges"></div>
        <div class="descwrap">
          <p class="desc"></p>
          <button class="more" hidden>Показати повністю</button>
        </div>
        <div class="contact"></div>
        <div class="actions">
          <a class="btn open" target="_blank" rel="noopener">Відкрити</a>
          <button class="btn share">Поділитись</button>
          <button class="btn seen" title="Позначити переглянутим">✓</button>
        </div>
        <div class="mine">
          <select class="status">
            <option value="">Статус…</option>
            <option>Цікаво</option>
            <option>Подзвонити</option>
            <option>Дивився</option>
            <option>Відхилено</option>
            <option>Продано</option>
          </select>
          <input class="note" placeholder="Нотатка">
        </div>
      </div>
    </article>
  </template>

  <div class="toast" id="toast" hidden></div>
  <footer class="foot">Дані оновлюються автоматично раз на день. Переглянуті, статуси й нотатки зберігаються в цьому браузері.</footer>
  <script src="app.js"></script>
</body>
</html>
