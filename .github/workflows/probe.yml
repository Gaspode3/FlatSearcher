name: Перевірка сайтів (службове)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити сторінки
        run: |
          mkdir pages; i=0
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in \
            "https://rieltor.ua/lvov/flats-sale/3-rooms/" \
            "https://rieltor.ua/lvov/flats-sale/?rooms=3&owners=1" \
            "https://rieltor.ua/lvov/flats-sale/view/13086839/" \
            "https://mistechko.com/lvov/prodazh-trikimnatnih-kvartir/" \
            "https://mistechko.com/lvov/prodazh-kvartir/prodazh-3kim-kvartiri-po-vul-mikolajchuka-38-8387.html" \
            "https://svitkvartyr.com/prodazh-kvartyr/lviv/avstrijskyj-budynok" \
            "https://svitkvartyr.com/adverts/73870" \
            "https://www.olx.ua/api/v1/offers/?offset=0&limit=5&query=%D0%BA%D0%B2%D0%B0%D1%80%D1%82%D0%B8%D1%80%D0%B0" \
            "https://m.olx.ua/uk/nedvizhimost/kvartiry/prodazha-kvartir/lvov/" ; do
            i=$((i+1)); code=$(curl -sL -A "$UA" -H "Accept-Language: uk-UA,uk;q=0.9" -o pages/$i.html -w "%{http_code}" "$u"); echo "$i $code $(wc -c < pages/$i.html) $u" | tee -a pages/index.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages
